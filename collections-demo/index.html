<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#003F2A">
    <meta name="color-scheme" content="light dark">
    <meta name="darkreader-lock">
    <meta name="description" content="نسخة تجريبية تفاعلية من FREE LINE Collections — إدارة الذمم والتحصيلات وعهدة المحصّلين والصندوق اليومي. بيانات وهمية تعمل داخل متصفحك.">
    <title>FREE LINE Collections — نسخة تجريبية</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=ibm-plex-sans-arabic:400,500,600,700">
    <link rel="stylesheet" href="assets/app.css?v=2">
</head>
<body>
    <div id="app" aria-live="polite"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <dialog id="confirm" class="dialog">
        <form method="dialog">
            <p class="dialog-title">تأكيد العملية</p>
            <p class="dialog-body" id="confirm-body"></p>
            <div class="dialog-actions">
                <button class="btn btn-primary" value="yes" id="confirm-yes">تأكيد</button>
                <button class="btn btn-secondary" value="no">إلغاء</button>
            </div>
        </form>
    </dialog>
    <noscript><p style="padding:2rem">تحتاج هذه النسخة التجريبية إلى تفعيل JavaScript.</p></noscript>
    <script src="assets/app.js?v=2"></script>

</html>
